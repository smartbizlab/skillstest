  .card:focus-visible{ outline:2px solid var(--emerald); outline-offset:2px; }
  .card.static{ cursor:default; }

    margin-left:8px;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--rust);
    color:var(--carbon);
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;

    text-decoration:none;
    display:inline-block;

  .link-back:hover{ color:var(--text); }

  .thankyou-wrap p{ color:var(--muted); margin-bottom:32px; }

// Config del formulario GHL — AJUSTAR el formId/dominio y los nombres de campo si difieren de los reales
const GHL_DOMAIN = "link.centralize.es";
const GHL_FORM_ID = "E0DGPlNKwF71BjKkElAU";

/* =========================================================
   MOTOR — no debería necesitar cambios al agregar perfiles
   ========================================================= */

const state = { step: "landing", profile: null, symptomIndex: null };
const app = document.getElementById("app");

function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function progressBar(filledCount){
  let segs = "";
  for(let i=0;i<3;i++){ segs += `<span class="${i<filledCount ? 'filled':''}"></span>`; }
  return `<div class="progress">${segs}</div>`;
}

function eyebrow(){ return `<div class="eyebrow">Skills Diagnóstico · Smart Business</div>`; }

function render(){
  if(state.step === "landing") return renderLanding();
  if(state.step === "symptom") return renderSymptom();
  if(state.step === "form") return renderForm();
  if(state.step === "thankyou") return renderThankyou();
  if(state.step === "result") return renderResult();
}

function renderLanding(){
  const cards = PROFILES.map((p,i) => {
    if(!p.hasData){
      return `<div class="card disabled static">
        <div class="card-title">${esc(p.name)} <span class="badge-soon">Próximamente</span></div>
        <div class="card-sub">${esc(p.tagline)}</div>
      </div>`;
    }
    return `<div class="card" tabindex="0" role="button" onclick="selectProfile(${i})" onkeydown="if(event.key==='Enter')selectProfile(${i})">
      <div class="card-title">${esc(p.name)}</div>
      <div class="card-sub">${esc(p.tagline)}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(0)}
    <h1>¿Qué tan bien equipado está tu Claude para tu trabajo?</h1>
    <p class="lead">Elige tu perfil y en menos de 2 minutos te decimos cuáles son las 3 skills de Claude más importantes para resolver tu dolor de hoy. Ya están construidas y listas para instalar.</p>
    <div class="grid">${cards}</div>
    <div class="footer">
      <span>Smart Business</span>
      <span>◆</span>
      <span>Skills para Claude</span>
    </div>
  `;
}

function selectProfile(i){
  state.profile = PROFILES[i];
  state.step = "symptom";
  render();
}

function renderSymptom(){
  const p = state.profile;
  const cards = p.symptoms.map((s,i) => `
    <div class="card" tabindex="0" role="button" onclick="selectSymptom(${i})" onkeydown="if(event.key==='Enter')selectSymptom(${i})">
      <div class="card-title">${esc(s.label)}</div>
    </div>
  `).join("");

  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(1)}
    <h2>${esc(p.name)}</h2>
    <p class="lead">¿Cuál de estas situaciones describe mejor tu momento actual?</p>
    ${cards}
    <a href="#" class="link-back" onclick="goLanding(event)">← Cambiar de perfil</a>
  `;
}

function selectSymptom(i){
  state.symptomIndex = i;
  state.step = "form";
  render();
}

function buildGHLUrl(){
  const p = state.profile;
  const s = p.symptoms[state.symptomIndex];
  const params = new URLSearchParams({
    perfil: p.name,
    problema: s.label,
    skill_1: s.skills[0] || "",
    skill_2: s.skills[1] || "",
    skill_3: s.skills[2] || ""
  });
  return `https://${GHL_DOMAIN}/widget/form/${GHL_FORM_ID}?${params.toString()}`;
}

let resizeGraceTimer = null;
let baselineHeight = null;

function renderForm(){
  const src = buildGHLUrl();
  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(1)}
    <h2>Ya casi tienes tu diagnóstico</h2>
    <div class="form-note">Para conocer las 3 habilidades (skills) más importantes que deberías tener, diligencia el formulario.</div>
    <div class="ghl-frame-wrap" id="ghlWrap">
      <div class="ghl-loading" id="ghlLoading">Cargando formulario…</div>
      <iframe class="ghl-iframe" id="ghlFrame" src="${src}" onload="onFrameLoad()"></iframe>
    </div>
  `;
  window.addEventListener("message", onGHLMessage);
}

function onFrameLoad(){
  document.getElementById("ghlLoading").style.display = "none";
  const frame = document.getElementById("ghlFrame");
  baselineHeight = frame.offsetHeight;
  // Grace period antes de activar la detección por salto de altura (evita falsos positivos
  // mientras el formulario termina de renderizar sus propios campos)
  clearTimeout(resizeGraceTimer);
  resizeGraceTimer = setTimeout(() => {
    startResizeWatch(frame);
  }, 1200);
}

function startResizeWatch(frame){
  if(!window.ResizeObserver) return;
  const ro = new ResizeObserver(entries => {
    for(const entry of entries){
      const h = entry.contentRect.height;
      if(baselineHeight != null && Math.abs(h - baselineHeight) > 80){
        ro.disconnect();
        onFormSubmitted();
      }
    }
  });
  ro.observe(frame);
}

function onGHLMessage(e){
  // Formato real de GoHighLevel: el mensaje llega como un ARRAY (no un objeto).
  // - data[0] === 'msgsndr-booking-complete' → evento de calendario/booking (no aplica a este formulario, se deja por si acaso).
  // - data[2] → string JSON con los campos del formulario enviado (incluye email, full_name, etc.)
  const data = e.data;
  if(!Array.isArray(data)) return;

  if(data[0] === "msgsndr-booking-complete"){
    onFormSubmitted();
    return;
  }

  const inputJSON = data[2];
  if(typeof inputJSON === "string"){
    try{
      const parsed = JSON.parse(inputJSON);
      if(parsed && (parsed.email || parsed.full_name || parsed.customer_id)){
        onFormSubmitted();
      }
    } catch(err){ /* no era JSON del formulario, se ignora */ }
  }
}

function onFormSubmitted(){
  window.removeEventListener("message", onGHLMessage);
  state.step = "thankyou";
  render();
}

function renderThankyou(){
  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(2)}
    <div class="thankyou-wrap">
      <h2>¡Apreciamos tu interés!</h2>
      <p>Tu diagnóstico está listo y lo enviaremos a tu correo.</p>
      <button class="btn" onclick="goResult()">Conoce tus skills</button>
    </div>
  `;
}

function goResult(){
  state.step = "result";
  render();
}

function renderResult(){
  const p = state.profile;
  const s = p.symptoms[state.symptomIndex];
  const cards = s.skills.map((name, i) => `
    <div class="skill-card">
      <div class="skill-num">0${i+1}</div>
      <div class="skill-body">
        <h3>${esc(name)}</h3>
        <p>${esc(SKILLS[name] || "")}</p>
      </div>
    </div>
  `).join("");

  const landingUrl = LANDING_BASE + p.slug + ".html";

  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(3)}
    <div class="lock">🔒</div>
    <h2>Tu diagnóstico está listo</h2>
    <p class="recap">Perfil: <b>${esc(p.name)}</b> · Problema: <b>${esc(s.label)}</b></p>
    ${cards}
    <div class="cta-box">
      <p>Estas 3 Skills ya están construidas y listas para instalar en Claude.</p>
      <a class="btn" href="${landingUrl}" target="_blank" rel="noopener">Ver pack completo para mi perfil →</a>
    </div>
    <a href="#" class="link-back" onclick="goLanding(event)">← Hacer diagnóstico de nuevo</a>
    <div class="footer">
      <span>Smart Business</span>
      <span>◆</span>
      <span>Skills para Claude</span>
    </div>
  `;
}

function goLanding(e){
  if(e) e.preventDefault();
  state.step = "landing";
  state.profile = null;
  state.symptomIndex = null;
  render();
}

render();
</script>
