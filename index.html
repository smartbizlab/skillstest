  .eyebrow{

    letter-spacing:0.08em;
    text-transform:uppercase;

    margin-bottom:16px;
  }
  .progress{
    display:flex;
    gap:8px;
    margin-bottom:40px;
  }
  .progress span{
    height:4px;
    flex:1;
    border-radius:2px;
    background:var(--card-border);
    transition:background .3s ease;
  }
  .progress span.filled{ background:var(--emerald); }

    padding:24px;
    margin-bottom:16px;
    cursor:pointer;

  .card:hover{ border-color:var(--emerald); transform:translateY(-2px); }
  .card:focus-visible{ outline:2px solid var(--emerald); outline-offset:2px; }
  .card.static{ cursor:default; }
  .card.static:hover{ transform:none; border-color:var(--card-border); }
  .card.disabled{
    opacity:0.45;
    cursor:not-allowed;
  }
  .card.disabled:hover{ transform:none; border-color:var(--card-border); }

  .card-title{ font-weight:700; font-size:17px; margin-bottom:4px; }
  .card-sub{ color:var(--muted); font-size:14px; }
  .badge-soon{

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;
    background:var(--emerald);
    color:var(--carbon);
    padding:3px 8px;
    border-radius:6px;
    margin-left:8px;
    vertical-align:middle;

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--rust);
    color:var(--carbon);
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    text-transform:uppercase;

    border-radius:999px;
    cursor:pointer;
    width:100%;
    text-decoration:none;

    color:var(--muted);
    font-size:14px;
    text-decoration:none;
    display:inline-block;
    margin-top:24px;
  }
  .link-back:hover{ color:var(--text); }

    margin-bottom:16px;

  .skill-body p{ margin:0; color:var(--muted); font-size:15px; }

  .recap b{ color:var(--text); }

function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function progressBar(filledCount){
  let segs = "";
  for(let i=0;i<3;i++){ segs += `<span class="${i<filledCount ? 'filled':''}"></span>`; }
  return `<div class="progress">${segs}</div>`;
}

function eyebrow(){ return `<div class="eyebrow">Skills Diagnóstico · Smart Business</div>`; }

function render(){
  if(state.step === "landing") return renderLanding();
  if(state.step === "symptom") return renderSymptom();
  if(state.step === "form") return renderForm();
  if(state.step === "thankyou") return renderThankyou();
  if(state.step === "result") return renderResult();
}

function renderLanding(){
  const cards = PROFILES.map((p,i) => {
    if(!p.hasData){
      return `<div class="card disabled static">

        <div class="card-sub">${esc(p.tagline)}</div>
      </div>`;
    }
    return `<div class="card" tabindex="0" role="button" onclick="selectProfile(${i})" onkeydown="if(event.key==='Enter')selectProfile(${i})">
      <div class="card-title">${esc(p.name)}</div>
      <div class="card-sub">${esc(p.tagline)}</div>
    </div>`;
  }).join("");

    ${progressBar(0)}
    <h1>¿Qué tan bien equipado está tu Claude para tu trabajo?</h1>

}

    problema: s.label,
    skill_1: s.skills[0] || "",
    skill_2: s.skills[1] || "",
    skill_3: s.skills[2] || ""
  });
  return `https://${GHL_DOMAIN}/widget/form/${GHL_FORM_ID}?${params.toString()}`;
}

let resizeGraceTimer = null;
let baselineHeight = null;

function renderForm(){
  const src = buildGHLUrl();
  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(1)}
    <h2>Ya casi tienes tu diagnóstico</h2>
    <div class="form-note">Para conocer las 3 habilidades (skills) más importantes que deberías tener, diligencia el formulario.</div>
    <div class="ghl-frame-wrap" id="ghlWrap">
      <div class="ghl-loading" id="ghlLoading">Cargando formulario…</div>
      <iframe class="ghl-iframe" id="ghlFrame" src="${src}" onload="onFrameLoad()"></iframe>
    </div>
  `;
  window.addEventListener("message", onGHLMessage);
}

function onFrameLoad(){
  document.getElementById("ghlLoading").style.display = "none";
  const frame = document.getElementById("ghlFrame");
  baselineHeight = frame.offsetHeight;
  // Grace period antes de activar la detección por salto de altura (evita falsos positivos
  // mientras el formulario termina de renderizar sus propios campos)
  clearTimeout(resizeGraceTimer);
  resizeGraceTimer = setTimeout(() => {
    startResizeWatch(frame);
  }, 1200);
}

function startResizeWatch(frame){
  if(!window.ResizeObserver) return;
  const ro = new ResizeObserver(entries => {
    for(const entry of entries){
      const h = entry.contentRect.height;
      if(baselineHeight != null && Math.abs(h - baselineHeight) > 80){
        ro.disconnect();
        onFormSubmitted();
      }
    }
  });
  ro.observe(frame);
}

function onGHLMessage(e){
  // Los formularios de GoHighLevel notifican eventos por postMessage.
  // Ajustar el chequeo de tipo/formId a lo que realmente envíe el formulario en producción.
  if(!e.data) return;
  const data = typeof e.data === "string" ? safeParse(e.data) : e.data;
  if(!data) return;
  if(data.formId === GHL_FORM_ID || data.type === "form-submit" || data.event === "form_submit"){
    onFormSubmitted();
  }
}

function safeParse(str){
  try { return JSON.parse(str); } catch(e){ return null; }
}

function onFormSubmitted(){
  window.removeEventListener("message", onGHLMessage);
  state.step = "thankyou";
  render();
}

function renderThankyou(){
  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(2)}
    <div class="thankyou-wrap">
      <h2>¡Apreciamos tu interés!</h2>
      <p>Tu diagnóstico está listo y lo enviaremos a tu correo.</p>
      <button class="btn" onclick="goResult()">Conoce tus skills</button>
    </div>
  `;
}

function goResult(){
  state.step = "result";
  render();
}

function renderResult(){
  const p = state.profile;
  const s = p.symptoms[state.symptomIndex];
  const cards = s.skills.map((name, i) => `
    <div class="skill-card">
      <div class="skill-num">0${i+1}</div>
      <div class="skill-body">
        <h3>${esc(name)}</h3>
        <p>${esc(SKILLS[name] || "")}</p>
      </div>
    </div>
  `).join("");

  const landingUrl = LANDING_BASE + p.slug + ".html";

  app.innerHTML = `
    ${eyebrow()}
    ${progressBar(3)}
    <div class="lock">🔒</div>
    <h2>Tu diagnóstico está listo</h2>
    <p class="recap">Perfil: <b>${esc(p.name)}</b> · Problema: <b>${esc(s.label)}</b></p>
    ${cards}
    <div class="cta-box">
      <p>Estas 3 Skills ya están construidas y listas para instalar en Claude.</p>
      <a class="btn" href="${landingUrl}" target="_blank" rel="noopener">Ver pack completo para mi perfil →</a>
    </div>
    <a href="#" class="link-back" onclick="goLanding(event)">← Hacer diagnóstico de nuevo</a>
    <div class="footer">
      <span>Smart Business</span>
      <span>◆</span>
      <span>Skills para Claude</span>
    </div>
  `;
}

function goLanding(e){
  if(e) e.preventDefault();
  state.step = "landing";
  state.profile = null;
  state.symptomIndex = null;
  render();
}

render();
</script>
</body>
</html>
